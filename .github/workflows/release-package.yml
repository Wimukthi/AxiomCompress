name: Release Package

on:
  workflow_dispatch:
    inputs:
      version:
        description: Committed four-part app version from src/gui/axiom_gui.rc
        required: true

jobs:
  package:
    name: Package win-x64
    runs-on: windows-2025-vs2026

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Checkout Wimukthi.Win32Theme
        uses: actions/checkout@v6
        with:
          repository: Wimukthi/Wimukthi.Win32Theme
          ref: f39163076210144c492f79c82979218a10553bfb
          path: Wimukthi.Win32Theme

      - name: Add MSBuild to PATH
        uses: microsoft/setup-msbuild@v3

      - name: Build Release
        run: .\tools\build_msvc.ps1 -Configuration Release -AutoIncrementVersion:$false -ThemeRoot "$env:GITHUB_WORKSPACE\Wimukthi.Win32Theme"

      - name: Test Release
        run: .\out\Release\axiom_roundtrip.exe

      - name: Resolve Package Version
        id: package-version
        shell: pwsh
        run: |
          $version = .\tools\Update-AxiomVersion.ps1 -PrintVersion
          $expected = "${{ inputs.version }}"
          if ($version -ne $expected) {
            throw "Build produced version $version, but workflow input expected $expected."
          }
          "PACKAGE_VERSION=$version" | Out-File -FilePath $env:GITHUB_ENV -Append
          "version=$version" | Out-File -FilePath $env:GITHUB_OUTPUT -Append

      - name: Create ZIP
        shell: pwsh
        run: |
          $version = $env:PACKAGE_VERSION
          $stage = Join-Path $env:RUNNER_TEMP "Axiom-$version-win-x64"
          $zip = "Axiom-$version-win-x64.zip"

          New-Item -ItemType Directory -Path $stage -Force | Out-Null

          Copy-Item -LiteralPath ".\out\Release\Axiom.exe" -Destination $stage
          Copy-Item -LiteralPath ".\out\Release\axiomc.exe" -Destination $stage
          Copy-Item -LiteralPath ".\out\Release\AxiomSfx.bin" -Destination $stage
          Copy-Item -LiteralPath ".\out\Release\backends" -Destination (Join-Path $stage "backends") -Recurse
          Copy-Item -LiteralPath ".\README.md" -Destination $stage
          Copy-Item -LiteralPath ".\CLI_GUIDE.md" -Destination $stage
          Copy-Item -LiteralPath ".\ARCHITECTURE.md" -Destination $stage
          Copy-Item -LiteralPath ".\FORMAT.md" -Destination $stage
          Copy-Item -LiteralPath ".\LICENSE" -Destination $stage
          Copy-Item -LiteralPath ".\THIRD_PARTY_NOTICES.md" -Destination $stage
          Copy-Item -LiteralPath ".\docs" -Destination (Join-Path $stage "docs") -Recurse
          $licenses = Join-Path $stage "licenses"
          $source = Join-Path $licenses "source"
          New-Item -ItemType Directory -Path $source -Force | Out-Null
          Copy-Item -LiteralPath ".\Wimukthi.Win32Theme\LICENSE" -Destination (Join-Path $licenses "Wimukthi.Win32Theme-LICENSE.txt")
          Copy-Item -LiteralPath ".\Wimukthi.Win32Theme\THIRD_PARTY_NOTICES.md" -Destination (Join-Path $licenses "Wimukthi.Win32Theme-NOTICES.md")
          Copy-Item -LiteralPath ".\Wimukthi.Win32Theme\third_party\darkmodelib\LICENSE.md" -Destination (Join-Path $licenses "Darkmodelib-MPL-2.0.txt")
          Copy-Item -LiteralPath ".\Wimukthi.Win32Theme\third_party\darkmodelib\LICENSE-MIT.md" -Destination (Join-Path $licenses "Darkmodelib-MIT.txt")
          Copy-Item -LiteralPath ".\Wimukthi.Win32Theme\third_party\darkmodelib" -Destination (Join-Path $source "darkmodelib") -Recurse

          Compress-Archive -Path (Join-Path $stage "*") -DestinationPath $zip -Force

      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup --yes --no-progress

      - name: Create Installer
        shell: pwsh
        run: .\installer\build-installer.ps1 -Version "$env:PACKAGE_VERSION" -SkipBuild -SkipTests -ThemeRoot "$env:GITHUB_WORKSPACE\Wimukthi.Win32Theme"

      - name: Upload ZIP
        uses: actions/upload-artifact@v7
        with:
          name: Axiom-${{ steps.package-version.outputs.version }}-win-x64
          path: Axiom-${{ steps.package-version.outputs.version }}-win-x64.zip
          if-no-files-found: error

      - name: Upload Installer
        uses: actions/upload-artifact@v7
        with:
          name: Axiom-${{ steps.package-version.outputs.version }}-installer-win-x64
          path: installer\output\AxiomSetup-${{ steps.package-version.outputs.version }}-win-x64.exe
          if-no-files-found: error
